# Standalone PostgreSQL service for local development
# Usage: docker compose -f docker-compose.db.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: borrowbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: borrowbox_dev
    ports:
      - "5432:5432"
    volumes:
      - borrowbox_pgdata:/var/lib/postgresql/data

volumes:
  borrowbox_pgdata:

